name: Data pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm scrape
      - name: Commit updated data
        run: |
          git config user.name "peptides-guide-bot"
          git config user.email "bot@users.noreply.github.com"
          git add packages/shared/src/data/vendors.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): refresh vendors.json ($(date -u +%F))"
            git push
          fi
